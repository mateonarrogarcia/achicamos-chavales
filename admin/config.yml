backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "noticias"
    label: "Noticias"
    folder: "content/noticias"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoría", name: "category", widget: "select", options: ["LaLiga", "Fútbol", "Europa", "Fichajes", "Opinión"] }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Imagen de portada", name: "image", widget: "image", required: false }
      - { label: "Texto de la noticia", name: "body", widget: "markdown" }
